<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="pseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect width="128" height="128" rx="26" fill="url(#pseGrad)"/>
  
  <!-- Flowchart / Algorithm diagram element -->
  <rect x="22" y="24" width="84" height="28" rx="6" fill="#FFFFFF" opacity="0.95" filter="url(#shadow)"/>
  <text x="64" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#0D47A1" text-anchor="middle">INICIO</text>
  
  <!-- Arrow down -->
  <path d="M64 54 L64 64 M58 60 L64 66 L70 60" stroke="#FFCA28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- PSeInt badge banner -->
  <rect x="18" y="70" width="92" height="38" rx="8" fill="#FFCA28" filter="url(#shadow)"/>
  <text x="64" y="96" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#0D47A1" text-anchor="middle" letter-spacing="0.5">PSeInt</text>
</svg>
